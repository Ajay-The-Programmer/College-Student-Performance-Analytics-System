{% extends "base.html" %}

{% block title %}{{ action }} Attendance - College Student Performance Analytics System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
                    <h3 class="fw-bold text-navy mb-0">
                        <i class="bi bi-calendar-check text-success me-2"></i>{{ action }} Attendance
                    </h3>
                    <a href="{{ url_for('attendance.overview') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to List
                    </a>
                </div>

                <form method="POST">
                    <div class="row g-3">
                        <!-- Student Selection Dropdown -->
                        <div class="col-12">
                            <label for="student_id" class="form-label fw-semibold">Select Student <span class="text-danger">*</span></label>
                            <select class="form-select" id="student_id" name="student_id" required>
                                <option value="">-- Choose Student --</option>
                                {% for s in students %}
                                    <option value="{{ s.id }}" {% if attendance and (attendance.student_id|string == s.id|string or (attendance.student_id is defined and attendance.student_id == s.id)) %}selected{% endif %}>
                                        {{ s.roll_number }} - {{ s.first_name }} {{ s.last_name }} ({{ s.department }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Subject Selection Dropdown -->
                        <div class="col-12">
                            <label for="subject_id" class="form-label fw-semibold">Select Subject <span class="text-danger">*</span></label>
                            <select class="form-select" id="subject_id" name="subject_id" required>
                                <option value="">-- Choose Subject --</option>
                                {% for sub in subjects %}
                                    <option value="{{ sub.id }}" {% if attendance and (attendance.subject_id|string == sub.id|string or (attendance.subject_id is defined and attendance.subject_id == sub.id)) %}selected{% endif %}>
                                        {{ sub.subject_code }} - {{ sub.subject_name }} (Sem {{ sub.semester }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Attendance Date -->
                        <div class="col-md-6">
                            <label for="attendance_date" class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="attendance_date" name="attendance_date" value="{% if attendance and attendance.attendance_date %}{% if attendance.attendance_date.strftime %}{{ attendance.attendance_date.strftime('%Y-%m-%d') }}{% else %}{{ attendance.attendance_date }}{% endif %}{% else %}{{ current_date if current_date else '' }}{% endif %}" required>
                        </div>

                        <!-- Status Selection -->
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Present" {% if not attendance or (attendance and (attendance.status == 'Present' or not attendance.status)) %}selected{% endif %}>Present</option>
                                <option value="Absent" {% if attendance and attendance.status == 'Absent' %}selected{% endif %}>Absent</option>
                            </select>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                        <a href="{{ url_for('attendance.overview') }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
