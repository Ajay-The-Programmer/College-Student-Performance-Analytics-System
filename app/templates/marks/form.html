{% extends "base.html" %}

{% block title %}{{ action }} Marks - College Student Performance Analytics System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
                    <h3 class="fw-bold text-navy mb-0">
                        <i class="bi bi-journal-plus text-warning me-2"></i>{{ action }} Marks
                    </h3>
                    <a href="{{ url_for('marks.overview') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to List
                    </a>
                </div>

                <form method="POST">
                    <div class="row g-3">
                        <!-- Student Dropdown -->
                        <div class="col-12">
                            <label for="student_id" class="form-label fw-semibold">Select Student <span class="text-danger">*</span></label>
                            <select class="form-select" id="student_id" name="student_id" required>
                                <option value="">-- Choose Student --</option>
                                {% for s in students %}
                                    <option value="{{ s.id }}" {% if marks and (marks.student_id|string == s.id|string or (marks.student_id is defined and marks.student_id == s.id)) %}selected{% endif %}>
                                        {{ s.roll_number }} - {{ s.first_name }} {{ s.last_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Subject Dropdown -->
                        <div class="col-12">
                            <label for="subject_id" class="form-label fw-semibold">Select Subject <span class="text-danger">*</span></label>
                            <select class="form-select" id="subject_id" name="subject_id" required>
                                <option value="">-- Choose Subject --</option>
                                {% for sub in subjects %}
                                    <option value="{{ sub.id }}" {% if marks and (marks.subject_id|string == sub.id|string or (marks.subject_id is defined and marks.subject_id == sub.id)) %}selected{% endif %}>
                                        {{ sub.subject_code }} - {{ sub.subject_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Internal Marks (0 - 30) -->
                        <div class="col-md-6">
                            <label for="internal_marks" class="form-label fw-semibold">Internal Marks (0 - 30) <span class="text-danger">*</span></label>
                            <input type="number" step="0.1" min="0" max="30" class="form-control" id="internal_marks" name="internal_marks" value="{{ marks.internal_marks if marks and marks.internal_marks is defined else '' }}" placeholder="e.g. 25.0" required>
                        </div>

                        <!-- External Marks (0 - 70) -->
                        <div class="col-md-6">
                            <label for="external_marks" class="form-label fw-semibold">External Marks (0 - 70) <span class="text-danger">*</span></label>
                            <input type="number" step="0.1" min="0" max="70" class="form-control" id="external_marks" name="external_marks" value="{{ marks.external_marks if marks and marks.external_marks is defined else '' }}" placeholder="e.g. 58.5" required>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                        <a href="{{ url_for('marks.overview') }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-warning text-dark rounded-pill px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
