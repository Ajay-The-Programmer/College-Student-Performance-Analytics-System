{% extends "base.html" %}

{% block title %}{{ action }} Student - College Student Performance Analytics System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
                    <h3 class="fw-bold text-navy mb-0">
                        <i class="bi bi-person-badge text-primary me-2"></i>{{ action }} Student
                    </h3>
                    <a href="{{ url_for('students.index') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to List
                    </a>
                </div>

                <form method="POST">
                    <div class="row g-3">
                        <!-- Roll Number -->
                        <div class="col-md-6">
                            <label for="roll_number" class="form-label fw-semibold">Roll Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="roll_number" name="roll_number" value="{{ student.roll_number if student else '' }}" placeholder="e.g. CS202601" required>
                        </div>

                        <!-- Course -->
                        <div class="col-md-6">
                            <label for="course" class="form-label fw-semibold">Course</label>
                            <input type="text" class="form-control" id="course" name="course" value="{{ student.course if student else '' }}" placeholder="e.g. B.Tech / Diploma CS">
                        </div>

                        <!-- First Name -->
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ student.first_name if student else '' }}" placeholder="First name" required>
                        </div>

                        <!-- Last Name -->
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ student.last_name if student else '' }}" placeholder="Last name" required>
                        </div>

                        <!-- Department -->
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ student.department if student else '' }}" placeholder="e.g. Computer Engineering" required>
                        </div>

                        <!-- Semester -->
                        <div class="col-md-6">
                            <label for="semester" class="form-label fw-semibold">Semester (1 - 8) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="semester" name="semester" min="1" max="8" value="{{ student.semester if student else '' }}" placeholder="e.g. 5" required>
                        </div>

                        <!-- Gender -->
                        <div class="col-md-6">
                            <label for="gender" class="form-label fw-semibold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="">Select Gender</option>
                                <option value="Male" {% if student and student.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if student and student.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if student and student.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <!-- Date of Birth -->
                        <div class="col-md-6">
                            <label for="date_of_birth" class="form-label fw-semibold">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ student.date_of_birth if student and student.date_of_birth else '' }}">
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ student.email if student else '' }}" placeholder="student@college.edu">
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ student.phone if student else '' }}" placeholder="Digits only (e.g. 9876543210)">
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                        <a href="{{ url_for('students.index') }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
