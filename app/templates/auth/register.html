{% extends "base.html" %}

{% block title %}Register - College Student Performance Analytics System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary display-4"></i>
                    <h3 class="fw-bold mt-2">Register Account</h3>
                    <p class="text-muted small">Authentication blueprint view placeholder</p>
                </div>
                <div class="alert alert-info py-2 small">
                    <i class="bi bi-info-circle me-1"></i> Registration is disabled in the initial setup.
                </div>
                <form onsubmit="return false;">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Full Name</label>
                        <input type="text" class="form-control rounded-3" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Email Address</label>
                        <input type="email" class="form-control rounded-3" disabled>
                    </div>
                    <button class="btn btn-primary w-100 rounded-pill fw-semibold py-2" disabled>Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
